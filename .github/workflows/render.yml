name: render
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id from the Supabase jobs table
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_MODEL_TEXT: ${{ vars.GEMINI_MODEL_TEXT }}
      GEMINI_MODEL_TEXT_FALLBACK: ${{ vars.GEMINI_MODEL_TEXT_FALLBACK }}
      GEMINI_MODEL_VISION: ${{ vars.GEMINI_MODEL_VISION }}
      CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE }}
      PYTHON_BIN: python
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg, fonts and Chrome libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-noto-core fonts-noto-color-emoji \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install Python packages
        run: pip install -q -r pipeline/requirements.txt

      - name: Install Node packages
        run: npm ci

      - name: Cache Remotion browser and assets
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.remotion
            .cache
          key: pulse-cache-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            pulse-cache-${{ hashFiles('package-lock.json') }}-

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Run pipeline
        run: npx tsx pipeline/run.ts "$JOB_ID"
