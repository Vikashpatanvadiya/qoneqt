<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qoneqt Pulse</title>
    <!-- Temporary Phase 2 test page. Replaced by the Lovable UI in Phase 7. -->
    <style>
      body { margin: 0; padding: 24px 16px; background: #0d0718; color: #f4f0ff; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 520px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 16px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 90px; padding: 12px; border-radius: 10px; border: 1px solid #3b2a66; background: #170d2b; color: inherit; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #7c3aed; color: white; font: inherit; font-weight: 600; }
      button:disabled { opacity: 0.5; }
      ul { padding: 0; list-style: none; }
      li { padding: 8px 0; border-bottom: 1px solid #261845; font-size: 14px; }
      .muted { color: #a99bc9; }
      .error { color: #ff8a8a; }
      video { width: 100%; border-radius: 12px; margin-top: 16px; background: black; }
    </style>
  </head>
  <body>
    <main>
      <h1>Qoneqt Pulse</h1>
      <textarea id="topic" placeholder="Topic, trend or idea"></textarea>
      <button id="go">Generate video</button>
      <p id="status" class="muted"></p>
      <ul id="stages"></ul>
      <div id="result"></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const text = (el, value, cls) => { el.textContent = value; el.className = cls || "muted"; };

      async function poll(id) {
        const res = await fetch("/api/jobs?id=" + id);
        const data = await res.json();
        if (!res.ok) return text($("status"), data.error, "error");
        $("stages").replaceChildren(...data.stages.map((s) => {
          const li = document.createElement("li");
          li.textContent = s.name + ": " + s.status + (s.summary ? " - " + s.summary : "");
          return li;
        }));
        const job = data.job;
        if (job.status === "done") {
          text($("status"), "Done: " + (job.title || ""));
          const video = document.createElement("video");
          video.controls = true; video.playsInline = true; video.src = job.video_url; video.poster = job.thumb_url || "";
          $("result").replaceChildren(video);
          $("go").disabled = false;
        } else if (job.status === "failed") {
          text($("status"), "Failed: " + job.error, "error");
          $("go").disabled = false;
        } else {
          text($("status"), "Status: " + job.status + ". This takes a few minutes.");
          setTimeout(() => poll(id), 3000);
        }
      }

      $("go").onclick = async () => {
        $("go").disabled = true; $("result").replaceChildren(); $("stages").replaceChildren();
        text($("status"), "Creating job...");
        const res = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input_type: "topic", input_text: $("topic").value }) });
        const data = await res.json();
        const job = data.jobs && data.jobs[0];
        if (!res.ok || !job || job.status === "failed") {
          $("go").disabled = false;
          return text($("status"), data.error || (job && job.error) || "Could not create the job", "error");
        }
        poll(job.id);
      };
    </script>
  </body>
</html>
